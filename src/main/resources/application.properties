spring.application.name=EcommerceSpring
server.port = ${PORT}
spring.datasource.url =jdbc:mysql://localhost:3306/ecommerce_db
spring.datasource.username=root
spring.datasource.password=root

# This tells springboot which JDBC driver class to use
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Tells hibernate to print all the generates all the SQL queries to the console. Useful for debugging
#or learning.
spring.jpa.show-sql=true

#Specifies the SQL Dialect hibernate should use.
#Ensures hibernate generates SQL-optimized SQL syntax. Without this,
#springboot might guess based on JDBC url.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#Controls how hibernate controls schema generation
#none -> no changes to DB schema
#create -> drops and recreates schema in every run.
#create-drop -> Drop schema at app stops
#update -> updates DB schema (add new cols and tables, won't delete anything)
spring.jpa.hibernate.ddl-auto=update
